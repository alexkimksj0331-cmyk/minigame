<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>세포 키우기 게임 (AI 추가)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f2fbff;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">크기: 20</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('scoreBoard');

        // 캔버스 크기 초기화 및 자동 조절 보장
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const WORLD_SIZE = 3000;
        const FOOD_COUNT = 600; 
        const AI_COUNT = 15; // AI 적의 마리 수

        // 플레이어
        let player = {
            x: WORLD_SIZE / 2, y: WORLD_SIZE / 2, r: 20, color: '#ff4757'
        };

        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // 먹이 생성 함수
        function createFood() {
            return {
                x: Math.random() * WORLD_SIZE,
                y: Math.random() * WORLD_SIZE,
                r: 4 + Math.random() * 3,
                color: `hsl(${Math.random() * 360}, 80%, 60%)`
            };
        }

        // AI 생성 함수
        function createAI() {
            return {
                x: Math.random() * WORLD_SIZE,
                y: Math.random() * WORLD_SIZE,
                r: 15 + Math.random() * 20, // 15~35 사이의 랜덤 초기 크기
                color: `hsl(${Math.random() * 360}, 60%, 40%)`
            };
        }

        const foods = Array.from({ length: FOOD_COUNT }, createFood);
        const ais = Array.from({ length: AI_COUNT }, createAI);

        function update() {
            // 1. 플레이어 이동
            const dx = mouseX - (canvas.width / 2);
            const dy = mouseY - (canvas.height / 2);
            const distanceToMouse = Math.hypot(dx, dy);

            if (distanceToMouse > 10) {
                const angle = Math.atan2(dy, dx);
                const currentSpeed = Math.max(2, 120 / player.r);
                player.x += Math.cos(angle) * currentSpeed;
                player.y += Math.sin(angle) * currentSpeed;
            }

            // 플레이어 맵 밖으로 안 나가게 제한
            player.x = Math.max(player.r, Math.min(WORLD_SIZE - player.r, player.x));
            player.y = Math.max(player.r, Math.min(WORLD_SIZE - player.r, player.y));

            // 2. 플레이어의 먹이 섭취
            for (let i = foods.length - 1; i >= 0; i--) {
                const f = foods[i];
                if (Math.hypot(player.x - f.x, player.y - f.y) < player.r) {
                    foods.splice(i, 1);
                    player.r = Math.sqrt((Math.PI * player.r ** 2 + Math.PI * f.r ** 2) / Math.PI);
                    scoreBoard.innerText = `크기: ${Math.floor(player.r)}`;
                    foods.push(createFood());
                }
            }

            // 3. AI 로직 (가장 가까운 먹이 찾아서 이동 & 먹기)
            ais.forEach((ai, aiIndex) => {
                let targetFood = null;
                let minFoodDist = Infinity;

                // AI 시야에 있는 가장 가까운 먹이 탐색
                foods.forEach(f => {
                    let d = Math.hypot(ai.x - f.x, ai.y - f.y);
                    if (d < minFoodDist) {
                        minFoodDist = d;
                        targetFood = f;
                    }
                });

                // 먹이를 향해 이동
                if (targetFood) {
                    let angle = Math.atan2(targetFood.y - ai.y, targetFood.x - ai.x);
                    let aiSpeed = Math.max(1.5, 100 / ai.r);
                    ai.x += Math.cos(angle) * aiSpeed;
                    ai.y += Math.sin(angle) * aiSpeed;
                }

                // AI 맵 이탈 방지
                ai.x = Math.max(ai.r, Math.min(WORLD_SIZE - ai.r, ai.x));
                ai.y = Math.max(ai.r, Math.min(WORLD_SIZE - ai.r, ai.y));

                // AI가 먹이 섭취
                for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    if (Math.hypot(ai.x - f.x, ai.y - f.y) < ai.r) {
                        foods.splice(i, 1);
                        ai.r = Math.sqrt((Math.PI * ai.r ** 2 + Math.PI * f.r ** 2) / Math.PI);
                        foods.push(createFood());
                    }
                }

                // 4. 플레이어와 AI 간의 포식(잡아먹기) 판정
                const distToPlayer = Math.hypot(player.x - ai.x, player.y - ai.y);
                
                // 크기가 10% 이상 더 커야 잡아먹을 수 있음
                if (distToPlayer < player.r && player.r > ai.r * 1.1) {
                    // 플레이어가 AI를 먹음
                    player.r = Math.sqrt((Math.PI * player.r ** 2 + Math.PI * ai.r ** 2) / Math.PI);
                    scoreBoard.innerText = `크기: ${Math.floor(player.r)}`;
                    ais.splice(aiIndex, 1);
                    ais.push(createAI()); // 죽은 AI는 새로운 위치에서 부활
                } else if (distToPlayer < ai.r && ai.r > player.r * 1.1) {
                    // AI가 플레이어를 먹음 (게임 오버 및 리셋)
                    alert("AI에게 잡아먹혔습니다! 게임이 다시 시작됩니다.");
                    player.r = 20;
                    player.x = WORLD_SIZE / 2;
                    player.y = WORLD_SIZE / 2;
                    scoreBoard.innerText = `크기: 20`;
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            
            // 카메라 중심을 플레이어로 이동
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            // 배경 격자(Grid) 그리기
            ctx.strokeStyle = '#e1e1e1';
            ctx.lineWidth = 1;
            for (let i = 0; i <= WORLD_SIZE; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
            }

            // 맵 테두리
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // 먹이 그리기
            foods.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.fill();
            });

            // AI 그리기
            ais.forEach(ai => {
                ctx.beginPath();
                ctx.arc(ai.x, ai.y, ai.r, 0, Math.PI * 2);
                ctx.fillStyle = ai.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.stroke();
            });

            // 플레이어 그리기
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#c0392b';
            ctx.stroke();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 게임 루프 시작
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
