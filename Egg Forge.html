<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Hatching Legends</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1a1a2e; color: white;
            font-family: 'Black Han Sans', sans-serif, 'Segoe UI';
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }

        :root {
            --base-scale: 1;
            --aura-color: white;
        }

        #topBar {
            width: 100%; padding: 15px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: space-around; align-items: center;
            font-size: 24px; font-weight: bold;
            border-bottom: 3px solid #16213e;
            box-sizing: border-box;
        }

        .gold-icon {
            background-color: #f1c40f; color: #d35400;
            padding: 2px 8px; border-radius: 4px;
            border: 2px solid #e67e22; font-weight: 900; margin-right: 5px;
        }

        .cps-text { font-size: 18px; color: #2ecc71; }

        #gameArea {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            width: 100%; position: relative;
        }

        #eggContainer {
            width: 250px; height: 250px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px; position: relative;
        }

        #eggImage {
            max-width: 100%; max-height: 100%;
            transition: transform 0.3s ease, filter 0.3s ease; display: none;
            clip-path: circle(45% at 50% 50%);
        }

        #eggInfo {
            font-size: 32px; font-weight: bold; margin-bottom: 5px;
            text-align: center;
        }

        #eggIncome {
            font-size: 18px; color: #f1c40f; margin-bottom: 20px;
        }

        .btn {
            padding: 15px 25px; font-size: 20px; font-weight: bold; color: white;
            border: none; border-radius: 12px; cursor: pointer;
            text-transform: uppercase; position: relative;
            transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s; margin: 5px;
        }
        .btn:active { transform: translateY(6px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none !important; }

        .btn-work { background: linear-gradient(to bottom, #3498db, #2980b9); box-shadow: 0 6px 0 #154360; }
        .btn-work:active:not(:disabled) { box-shadow: 0 0px 0 #154360; }
        .btn-enhance { background: linear-gradient(to bottom, #f39c12, #d35400); box-shadow: 0 6px 0 #78281f; }
        .btn-enhance:active:not(:disabled) { box-shadow: 0 0px 0 #78281f; }
        .btn-open-shop { background: linear-gradient(to bottom, #e74c3c, #c0392b); box-shadow: 0 6px 0 #7b241c; }
        .btn-open-shop:active:not(:disabled) { box-shadow: 0 0px 0 #7b241c; }

        #inventoryArea {
            width: 90%; max-width: 600px;
            background: rgba(0,0,0,0.4); padding: 15px;
            border-radius: 15px; margin-bottom: 20px;
            border: 2px solid #34495e;
        }
        .inv-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; text-align: center; color: #bdc3c7;}
        #inventoryGrid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
        }
        .inv-slot {
            aspect-ratio: 1; background: #2c3e50; border-radius: 10px;
            border: 3px solid #1abc9c; display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: relative; transition: 0.2s;
        }
        .inv-slot:hover { background: #34495e; }
        .inv-slot.empty { border-color: #34495e; cursor: default; }
        .inv-slot.equipped { border-color: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        
        .inv-egg-img { 
            max-width: 80%; max-height: 80%; pointer-events: none; 
            clip-path: circle(45% at 50% 50%);
        }
        .inv-lvl { position: absolute; bottom: 5px; right: 5px; font-size: 14px; font-weight: bold; }

        #logText { margin-top: 10px; font-size: 18px; color: #bdc3c7; height: 25px; }

        .overlay-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }

        .shop-box {
            background: #fff8e7; padding: 30px; border-radius: 25px; border: 6px solid #e74c3c;
            text-align: center; width: 90%; max-width: 500px; position: relative;
        }
        .close-btn {
            position: absolute; top: -20px; right: -20px; width: 50px; height: 50px;
            background: #e74c3c; color: white; font-size: 28px; font-weight: bold;
            border: 4px solid #fff; border-radius: 50%; cursor: pointer; box-shadow: 0 6px 0 #922b21;
        }
        .close-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #922b21; }
        .shop-title {
            font-size: 36px; color: #fff; background: #e74c3c; padding: 10px 20px;
            border-radius: 15px; margin-top: -50px; display: inline-block;
            border: 4px solid #fff; text-shadow: 2px 2px 0 #c0392b;
        }
        .rates {
            font-size: 16px; margin: 20px 0; background: rgba(0,0,0,0.05);
            padding: 15px; border-radius: 10px; color: #333; font-weight: bold;
        }
        .shop-buttons { display: flex; gap: 10px; justify-content: center; }
        .btn-buy { flex: 1; background: linear-gradient(to bottom, #2ecc71, #27ae60); box-shadow: 0 6px 0 #145a32; font-size: 16px; border: none; border-radius: 10px; color: white; cursor: pointer; padding: 10px; font-weight: bold;}
        .btn-buy:active { box-shadow: 0 0px 0 #145a32; transform: translateY(6px); }

        .msg-box {
            background: #2c3e50; padding: 30px; border-radius: 20px; border: 4px solid #3498db;
            text-align: center; min-width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #msgTitle { font-size: 28px; margin-bottom: 10px; font-weight: bold; }
        #msgDesc { font-size: 18px; margin-bottom: 20px; color: #ecf0f1; }
        .btn-ok { 
            background: #3498db; padding: 10px 30px; font-size: 18px; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .btn-ok:hover { background: #2980b9; }

        .gacha-box { display: flex; flex-direction: column; align-items: center; }
        #gachaBoxIcon { font-size: 120px; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        #gachaResultImg { max-width: 150px; max-height: 150px; display: none; margin-bottom: 20px; clip-path: circle(45% at 50% 50%); }
        #gachaText { font-size: 28px; font-weight: bold; margin-bottom: 20px; text-shadow: 2px 2px 4px black; }

        /* ----- 변경된 애니메이션 정의 ----- */
        
        /* 1+2번 결합: 심장 박동 + 마력 집중 애니메이션 (강화 시도) */
        @keyframes heartbeat-glow {
            0% { transform: scale(var(--base-scale)); filter: brightness(1) drop-shadow(0 0 10px var(--aura-color)); }
            25% { transform: scale(calc(var(--base-scale) * 1.15)); filter: brightness(1.5) drop-shadow(0 0 30px var(--aura-color)); }
            50% { transform: scale(var(--base-scale)); filter: brightness(1) drop-shadow(0 0 10px var(--aura-color)); }
            75% { transform: scale(calc(var(--base-scale) * 1.15)); filter: brightness(1.5) drop-shadow(0 0 30px var(--aura-color)); }
            100% { transform: scale(var(--base-scale)); filter: brightness(1) drop-shadow(0 0 10px var(--aura-color)); }
        }

        /* 강화 성공 빛남 */
        @keyframes successGlow {
            0% { filter: brightness(1) drop-shadow(0 0 10px white); transform: scale(var(--base-scale)); }
            50% { filter: brightness(2) drop-shadow(0 0 50px yellow); transform: scale(calc(var(--base-scale) * 1.3)); }
            100% { filter: brightness(1) drop-shadow(0 0 10px white); transform: scale(var(--base-scale)); }
        }

        /* 강화 실패 파괴 */
        @keyframes breakEgg {
            0% { transform: scale(var(--base-scale)); filter: grayscale(0%); opacity: 1; }
            40% { transform: scale(calc(var(--base-scale) * 1.2)) rotate(15deg); filter: grayscale(50%) sepia(1) hue-rotate(-50deg) saturate(5); opacity: 0.9; }
            50% { transform: scale(calc(var(--base-scale) * 1.3)) rotate(-15deg); filter: grayscale(80%) sepia(1) hue-rotate(-50deg) saturate(5); opacity: 0.7; }
            100% { transform: scale(0); filter: grayscale(100%); opacity: 0; }
        }

        /* 상자 흔들기 (가챠용) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            50% { transform: translateX(5px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-5deg); }
        }

        /* 알 튀어나오기 (가챠용) */
        @keyframes popOut {
            0% { transform: scale(0) translateY(50px); opacity: 0; }
            60% { transform: scale(1.3) translateY(-20px); opacity: 1; filter: drop-shadow(0 0 20px white); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* 애니메이션 클래스 */
        .anim-heartbeat { animation: heartbeat-glow 1.25s ease-in-out infinite; }
        .anim-success { animation: successGlow 1s forwards; }
        .anim-break { animation: breakEgg 0.8s forwards; }
        .anim-shake { animation: shake 0.3s infinite; }
        .anim-pop { animation: popOut 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>

    <div id="topBar">
        <div><span class="gold-icon">G</span> <span id="moneyDisplay">10000</span></div>
        <div class="cps-text">초당 자동수익: +<span id="cpsDisplay">0</span> G</div>
    </div>

    <div id="gameArea">
        <div id="eggInfo">알을 장착해주세요!</div>
        <div id="eggIncome"></div>
        <div id="eggContainer">
            <img id="eggImage" src="" alt="알" onerror="this.src='https://via.placeholder.com/200/2c3e50/ffffff?text=EGG'">
        </div>

        <div id="inventoryArea">
            <div class="inv-title">🥚 내 인벤토리 (클릭하여 장착)</div>
            <div id="inventoryGrid"></div>
        </div>

        <div>
            <button class="btn btn-work" id="btnWork" onclick="earnMoney()">⛏️ 돈 벌기 (클릭)</button>
            <button class="btn btn-enhance" id="btnEnhance" onclick="enhanceEgg()">✨ 강화하기</button>
            <button class="btn btn-open-shop" id="btnShop" onclick="openShop()">🛒 EGG SHOP</button>
        </div>
        <div id="logText"></div>
    </div>

    <div id="shopModal" class="overlay-modal">
        <div class="shop-box">
            <button class="close-btn" onclick="closeShop()">X</button>
            <div class="shop-title">EGG SHOP</div>
            <div class="rates">Normal(64.9%) | Secret(30%) | Eternal(5%) | ✨ Divine(0.1%)</div>
            <div class="shop-buttons">
                <button class="btn-buy" onclick="buyBox(1, 1000)">BUY 1<br><span class="gold-icon">G</span> 1,000</button>
                <button class="btn-buy" onclick="buyBox(10, 9000)">BUY 10 (Best 1)<br><span class="gold-icon">G</span> 9,000</button>
            </div>
        </div>
    </div>

    <div id="msgModal" class="overlay-modal" style="z-index: 150;">
        <div class="msg-box" id="msgBoxBorder">
            <div id="msgTitle">알림</div>
            <div id="msgDesc">내용</div>
            <button class="btn-ok" onclick="closeMsgModal()">확인</button>
        </div>
    </div>

    <div id="gachaModal" class="overlay-modal" style="z-index: 200;">
        <div class="gacha-box">
            <div id="gachaBoxIcon">🎁</div>
            <img id="gachaResultImg" src="" onerror="this.src='https://via.placeholder.com/150/2c3e50/ffffff?text=EGG'">
            <div id="gachaText">상자를 여는 중...</div>
            <button class="btn-ok" id="gachaOkBtn" style="display: none;" onclick="closeGachaModal()">확인</button>
        </div>
    </div>

    <script>
        let money = 10000;
        let inventory = [];
        const MAX_INVENTORY = 10;
        let equippedIndex = -1;
        let isAnimating = false;
        // --- 게임 데이터 저장하기 ---
function saveData() {
    const gameData = {
        money: money,
        inventory: inventory,
        equippedIndex: equippedIndex
    };
    localStorage.setItem('hatchingLegendsSave', JSON.stringify(gameData));
}

// --- 게임 데이터 불러오기 ---
function loadData() {
    const savedData = localStorage.getItem('hatchingLegendsSave');
    if (savedData) {
        const gameData = JSON.parse(savedData);
        money = gameData.money;
        inventory = gameData.inventory;
        equippedIndex = gameData.equippedIndex;
    }
}

        const moneyDisplay = document.getElementById('moneyDisplay');
        const cpsDisplay = document.getElementById('cpsDisplay');
        const eggImage = document.getElementById('eggImage');
        const eggInfo = document.getElementById('eggInfo');
        const eggIncome = document.getElementById('eggIncome');
        const logText = document.getElementById('logText');
        const inventoryGrid = document.getElementById('inventoryGrid');
        
        const btnWork = document.getElementById('btnWork');
        const btnEnhance = document.getElementById('btnEnhance');
        const btnShop = document.getElementById('btnShop');

        const eggDB = {
            normal: { name: "Normal Egg", color: "white", src: "base_egg.png", gradeValue: 1, baseCps: 10 },
            secret: { name: "Secret Egg", color: "black", src: "secret_egg.png", gradeValue: 2, baseCps: 100 },
            eternal: { name: "Eternal Egg", color: "#a55eea", src: "eternal_egg.png", gradeValue: 3, baseCps: 1000 },
            divine: { name: "Divine Egg", color: "#ffd700", src: "divine_egg.png", gradeValue: 4, baseCps: 10000 }
        };

        function calculateCPS(egg) {
            return Math.floor(egg.baseCps * Math.pow(1.5, egg.level));
        }

        function getTextShadow(color) {
            if (color === "black") {
                return "text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;";
            }
            return "text-shadow: 2px 2px 4px black;";
        }

        function showMsgModal(title, desc, borderColor) {
            document.getElementById('msgModal').style.display = 'flex';
            document.getElementById('msgTitle').innerText = title;
            document.getElementById('msgTitle').style.color = borderColor;
            document.getElementById('msgDesc').innerHTML = desc;
            document.getElementById('msgBoxBorder').style.borderColor = borderColor;
        }

        function closeMsgModal() {
            document.getElementById('msgModal').style.display = 'none';
        }

        function toggleButtons(disabled) {
            isAnimating = disabled;
            btnWork.disabled = disabled;
            btnEnhance.disabled = disabled;
            btnShop.disabled = disabled;
        }

        function updateUI() {
            eggImage.className = "";
            moneyDisplay.innerText = money.toLocaleString();
            
            if (equippedIndex >= 0 && inventory[equippedIndex]) {
                const currentEgg = inventory[equippedIndex];
                eggImage.style.display = "block";
                eggImage.src = currentEgg.src;
                
                const textShadow = getTextShadow(currentEgg.color);
                eggInfo.innerHTML = `<span style="color:${currentEgg.color}; ${textShadow}">[+${currentEgg.level}] ${currentEgg.name}</span>`;
                
                let cps = calculateCPS(currentEgg);
                eggIncome.innerText = `현재 수익: 초당 +${cps.toLocaleString()} G`;
                cpsDisplay.innerText = cps.toLocaleString();
                
                // 베이스 크기와 아우라 색상을 CSS 변수로 설정하여 애니메이션과 연동
                let scale = 1 + (currentEgg.level * 0.05);
                let auraColor = currentEgg.color === "black" ? "rgba(255,255,255,0.7)" : currentEgg.color;
                let glow = currentEgg.level * 4; 
                let hue = currentEgg.level * 15; 
                
                eggImage.style.setProperty('--base-scale', scale);
                eggImage.style.setProperty('--aura-color', auraColor);
                
                eggImage.style.transform = `scale(${scale})`;
                eggImage.style.filter = `drop-shadow(0px 0px ${glow}px ${auraColor}) hue-rotate(${hue}deg)`;
            } else {
                eggImage.style.display = "none";
                eggInfo.innerHTML = `<span style="color:white; text-shadow: 2px 2px 4px black;">알을 장착해주세요!</span>`;
                eggIncome.innerText = "";
                cpsDisplay.innerText = "0";
            }

            inventoryGrid.innerHTML = "";
            for (let i = 0; i < MAX_INVENTORY; i++) {
                const slot = document.createElement('div');
                
                if (i < inventory.length) {
                    const egg = inventory[i];
                    slot.className = `inv-slot ${i === equippedIndex ? 'equipped' : ''}`;
                    const textShadow = getTextShadow(egg.color);
                    
                    slot.innerHTML = `
                        <img src="${egg.src}" class="inv-egg-img" onerror="this.src='https://via.placeholder.com/80/${egg.color.replace('#','')}/ffffff?text=EGG'">
                        <div class="inv-lvl" style="color:${egg.color}; ${textShadow}">+${egg.level}</div>
                    `;
                    slot.onclick = () => {
                        if(!isAnimating) equipEgg(i);
                    };
                } else {
                    slot.className = "inv-slot empty";
                }
                inventoryGrid.appendChild(slot);
            }
        }

        function equipEgg(index) {
            equippedIndex = index;
            log(`${inventory[index].name} 장착 완료!`);
            updateUI();
        }

        function earnMoney() {
            if(isAnimating) return;
            money += 1000;
            updateUI();
        }

        function log(msg) { logText.innerText = msg; }
        
        function openShop() { 
            if(isAnimating) return;
            document.getElementById('shopModal').style.display = 'flex'; 
        }
        function closeShop() { document.getElementById('shopModal').style.display = 'none'; }

        function buyBox(times, cost) {
            if (money < cost) { showMsgModal("알림", "G(골드)가 부족합니다!", "#e74c3c"); return; }
            if (inventory.length >= MAX_INVENTORY) { showMsgModal("알림", "인벤토리가 꽉 찼습니다!", "#e74c3c"); return; }

            money -= cost;
            let bestEggResult = null;
            let highestGrade = 0;

            for(let i=0; i<times; i++) {
    let rand = Math.random() * 100;
    
    // 확률 적용: Divine(0.1%), Eternal(5.0%), Secret(30.0%), Normal(64.9%)
    let resultKey = (rand < 0.1) ? "divine" : 
                    (rand < 5.1) ? "eternal" : 
                    (rand < 35.1) ? "secret" : "normal";

    if(eggDB[resultKey].gradeValue > highestGrade) {
        highestGrade = eggDB[resultKey].gradeValue;
        bestEggResult = resultKey;
    }
}

            const getEgg = eggDB[bestEggResult];
            inventory.push({
                id: bestEggResult,
                name: getEgg.name,
                color: getEgg.color,
                src: getEgg.src,
                gradeValue: getEgg.gradeValue,
                baseCps: getEgg.baseCps,
                level: 0
            });

            equippedIndex = inventory.length - 1;
            closeShop();
            startGachaAnimation(getEgg, times);
        }

        function startGachaAnimation(egg, times) {
            toggleButtons(true); 
            
            const gachaModal = document.getElementById('gachaModal');
            const boxIcon = document.getElementById('gachaBoxIcon');
            const resultImg = document.getElementById('gachaResultImg');
            const text = document.getElementById('gachaText');
            const okBtn = document.getElementById('gachaOkBtn');

            gachaModal.style.display = 'flex';
            boxIcon.style.display = 'block';
            resultImg.style.display = 'none';
            resultImg.className = ''; 
            okBtn.style.display = 'none';
            text.innerText = "상자를 여는 중...";
            text.style.color = "white";

            boxIcon.classList.add("anim-shake");

            setTimeout(() => {
                boxIcon.classList.remove("anim-shake");
                boxIcon.style.display = 'none';
                
                resultImg.src = egg.src;
                resultImg.style.display = 'block';
                resultImg.classList.add('anim-pop'); 
                
                const textShadow = getTextShadow(egg.color);
                text.innerHTML = `<span style="color:${egg.color}; ${textShadow}">${egg.name} 획득!</span>`;
                
                if(times === 10) log(`10회 뽑기 완료! 최고 등급: ${egg.name} 획득!`);
                else log(`${egg.name} 획득!`);

                setTimeout(() => {
                    okBtn.style.display = 'block';
                }, 800);

            }, 1500);
        }

        function closeGachaModal() {
            document.getElementById('gachaModal').style.display = 'none';
            toggleButtons(false); 
            updateUI();
        }

        function enhanceEgg() {
            if (isAnimating) return;
            if (equippedIndex < 0 || !inventory[equippedIndex]) {
                showMsgModal("알림", "강화할 알을 장착해주세요!", "#f39c12"); return;
            }

            const currentEgg = inventory[equippedIndex];
            let successRate = Math.max(10, 90 - (currentEgg.level * 5)); 
            let rand = Math.random() * 100;

            toggleButtons(true);
            log(`강화 시도 중... (성공률: ${successRate}%)`);
            
            // 흔들림 대신 심장 박동 + 마력 집중 애니메이션 적용
            eggImage.classList.add("anim-heartbeat");

            setTimeout(() => {
                eggImage.classList.remove("anim-heartbeat");

                if (rand <= successRate) {
                    currentEgg.level++;
                    eggImage.classList.add("anim-success");
                    
                    setTimeout(() => {
                        showMsgModal("✨ 강화 성공! ✨", `<span style="color:${currentEgg.color}; font-weight:bold;">${currentEgg.name}</span>이(가) <br><b style="color:#2ecc71; font-size:24px;">+${currentEgg.level}</b> 단계로 강화되었습니다!`, "#2ecc71");
                        log(`강화 성공! (+${currentEgg.level})`);
                        toggleButtons(false);
                        updateUI();
                    }, 1000); 

                } else {
                    eggImage.classList.add("anim-break");
                    
                    setTimeout(() => {
                        showMsgModal("💀 강화 실패 💀", `<span style="color:${currentEgg.color}; font-weight:bold;">${currentEgg.name}</span>이(가) <br>산산조각 나버렸습니다...`, "#e74c3c");
                        log(`${currentEgg.name} 파괴됨.`);
                        inventory.splice(equippedIndex, 1);
                        equippedIndex = -1;
                        toggleButtons(false);
                        updateUI();
                    }, 800); 
                }
            }, 700); 
        }

        setInterval(() => {
            if (equippedIndex >= 0 && inventory[equippedIndex]) {
                const cps = calculateCPS(inventory[equippedIndex]);
                money += cps;
                if(!isAnimating) updateUI(); 
                else moneyDisplay.innerText = money.toLocaleString(); 
            }
            saveData();
        }, 1000);

        loadData();
        updateUI();
    </script>
</body>
</html>
